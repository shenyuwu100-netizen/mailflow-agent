[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailflow-agent"
version = "0.1.0"
description = "Evidence-gated email automation with human review and a durable outbox"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<3.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
legacy = ["openai>=1.68,<2", "requests>=2.32,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2", "msal>=1.31,<2", "flask-cors>=5,<7", "flask-session>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["mailflow*"]

[tool.setuptools.package-data]
mailflow = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests_mailflow"]
addopts = "-q"
